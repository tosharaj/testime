services:
  db:
    image: postgres:16-alpine
    container_name: testtime-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testtime
    ports:
      - '5432:5432'
    volumes:
      - testtime_pgdata:/var/lib/postgresql/data

volumes:
  testtime_pgdata:
